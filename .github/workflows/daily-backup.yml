name: Verificação local com dados sintéticos
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run build
      - run: npm run test:billing
# Clinical backups run in the backend, encrypted into the dedicated private bucket.
# No production clinical data or secrets are used in CI.
