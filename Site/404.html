<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada (404) • Psicóloga Ana Lima</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/ana%20lima%20favcom.svg?v=10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #F7F5F0; color: #454944;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .card {
      max-width: 560px; text-align: center; padding: 48px 36px;
      background: #FFFFFF; border: 1px solid rgba(28, 43, 34, 0.12); border-radius: 24px;
    }
    .kicker { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A85A3F; margin-bottom: 12px; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.6rem; color: #1C2B22; margin: 0 0 14px; font-weight: 500; line-height: 1.15; }
    p { font-size: 1rem; line-height: 1.7; margin: 0 0 28px; color: #686D66; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { padding: 12px 24px; border-radius: 9999px; text-decoration: none; font-weight: 600; font-size: 0.88rem; }
    .primary { background: #1C2B22; color: #F7F5F0; }
    .secondary { border: 1px solid #1C2B22; color: #1C2B22; }
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">Erro 404 • Caminho não encontrado</div>
    <h1>Este endereço não existe ou foi movido.</h1>
    <p>Você pode retornar à página inicial do consultório da Psicóloga Ana Lima (CRP 04/60205) ou explorar os ensaios do Caderno Clínico.</p>
    <div class="actions">
      <a href="/" class="primary">Voltar ao Início</a>
      <a href="/blog" class="secondary">Caderno Clínico &amp; Blog</a>
      <a href="/contato" class="secondary">Contato</a>
    </div>
  </main>
</body>
</html>
