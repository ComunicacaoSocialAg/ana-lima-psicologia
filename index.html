<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <link rel="alternate icon" type="image/png" sizes="512x512" href="/pwa-512x512.png?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=7" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/manifest.json?v=7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ana Lima" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ana Lima" />
    <meta name="description" content="Sistema de Gestão Clínica da Psicóloga Ana Lima (CRP 04/60205)" />
    <title>Ana Lima | Gestão Clínica Psicológica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=8').then(
            (reg) => {
              reg.update();
              // Verifica automaticamente novas atualizações quando a Ana abre/foca o app no PC ou Android
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') reg.update();
              });
              window.addEventListener('focus', () => reg.update());
              // Verifica atualizações em segundo plano a cada 15 minutos
              setInterval(() => reg.update(), 15 * 60 * 1000);
            },
            (err) => console.warn('Falha no Service Worker:', err)
          );
        });
      }
    </script>
  </body>
</html>
